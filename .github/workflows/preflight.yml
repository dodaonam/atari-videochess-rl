name: Repository preflight

on:
  pull_request:
    branches:
      - initial-idea

permissions:
  contents: read

jobs:
  context:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        # actions/checkout v7.0.0, pinned to its full commit SHA.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        # actions/setup-python v7.0.0, pinned to its full commit SHA.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Validate canonical context
        run: python scripts/agent_preflight.py

      - name: Run standard-library context and bundle tests
        run: python -m unittest tests.test_agent_context tests.test_export_review_bundle -v
